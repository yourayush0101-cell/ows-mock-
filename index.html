<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC MTS Vocab Multi-Set Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --dark: #212529; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .platform-container { background: white; width: 100%; max-width: 900px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 5px; font-size: 28px; }
        .subtitle { text-align: center; color: #6c757d; margin-bottom: 30px; font-size: 14px; }
        .nav-tabs { display: flex; justify-content: space-around; border-bottom: 2px solid #dee2e6; margin-bottom: 25px; padding-bottom: 5px; }
        .tab-btn { background: none; border: none; font-size: 16px; font-weight: 600; cursor: pointer; padding: 10px 20px; color: #6c757d; transition: 0.2s; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .panel { display: none; }
        .panel.active { display: block; }
        
        /* Set Selection UI */
        .set-section { margin-bottom: 25px; background: #f1f3f5; padding: 15px; border-radius: 10px; }
        .set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        .set-btn { background: white; border: 1px solid #ced4da; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; }
        .set-btn:hover, .set-btn.selected { border-color: var(--primary); color: var(--primary); background: #e7f1ff; }
        
        /* Options Panel */
        .config-panel { background: #e9ecef; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
        
        /* Quiz Layout */
        .quiz-box { background: #fff; border: 1px solid #dee2e6; padding: 25px; border-radius: 10px; position: relative; }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: #6c757d; font-size: 14px; }
        .timer-badge { background: #fff3cd; color: #856404; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
        .question { font-size: 19px; font-weight: bold; margin-bottom: 20px; color: var(--dark); }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .opt-button { background: var(--light); border: 1px solid #ced4da; padding: 14px; text-align: left; border-radius: 8px; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .opt-button:hover { background: #e9ecef; }
        .opt-button.selected { background: #e7f1ff; border-color: var(--primary); color: #0056b3; font-weight: bold; }
        
        .action-container { display: flex; gap: 15px; margin-top: 20px; }
        .submit-btn { flex: 2; background: var(--primary); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        .quit-btn { flex: 1; background: var(--danger); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        
        .admin-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 20px; border-radius: 10px; margin-top: 25px; }
        .admin-box textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #ced4da; font-family: monospace; font-size: 12px; margin-top: 10px; }
        .score-big { font-size: 50px; font-weight: bold; color: var(--success); text-align: center; margin: 20px 0; }
    </style>
</head>
<body>

<div class="platform-container">
    <h1>SSC MTS Ultimate Vocab Platform</h1>
    <div class="subtitle">Daily Targeted Practice & Continuous Improvement Tracker</div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchPanel('test')">🎯 Take Test / Choose Mode</button>
        <button class="tab-btn" onclick="switchPanel('analytics')">📈 Progress Tracker Graph</button>
        <button class="tab-btn" onclick="switchPanel('admin')">⚙️ Add Daily Words (Admin)</button>
    </div>

    <!-- PANEL 1: TEST MODES -->
    <div id="panel-test" class="panel active">
        <div id="menu-view">
            <!-- Set Selector -->
            <div class="set-section">
                <h3 style="margin:0; font-size:16px;">📂 Select Practice Set:</h3>
                <div class="set-grid" id="set-buttons-container">
                    <!-- Dynamic sets buttons -->
                </div>
            </div>

            <!-- Timer Configuration -->
            <div class="config-panel">
                <label style="font-weight:bold; cursor:pointer;">
                    <input type="checkbox" id="timer-toggle" onchange="toggleTimerInput()" checked> Enable Question Timer
                </label>
                <div id="timer-seconds-box">
                    <label>Seconds per question: </label>
                    <input type="number" id="timer-seconds" value="15" min="5" max="60" style="width:50px; padding:5px; border-radius:4px; border:1px solid #ccc;">
                </div>
            </div>

            <h2 style="margin-bottom:15px; font-size:18px;">Select Category to Start Test:</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <button class="submit-btn" style="background:#6c757d;" onclick="startQuiz('OWS')">One Word (OWS)</button>
                <button class="submit-btn" style="background:#6c757d;" onclick="startQuiz('Synonym')">Synonyms</button>
                <button class="submit-btn" style="background:#6c757d;" onclick="startQuiz('Antonym')">Antonyms</button>
                <button class="submit-btn" style="background:#6c757d;" onclick="startQuiz('Idiom')">Idioms & Phrases</button>
                <button class="submit-btn" style="grid-column: 1 / -1; background: linear-gradient(135deg, #007bff, #0056b3);" onclick="startQuiz('MIX')">🚀 Start Full MIX Mock Test</button>
            </div>
        </div>

        <div id="quiz-view" style="display:none;">
            <!-- Dynamic quiz elements go here -->
        </div>
    </div>

    <!-- PANEL 2: ANALYTICS -->
    <div id="panel-analytics" class="panel">
        <h2>Your Improvement Over Time</h2>
        <div class="graph-box">
            <canvas id="analyticsChart"></canvas>
        </div>
    </div>

    <!-- PANEL 3: CODE UPDATE (ADMIN) -->
    <div id="panel-admin" class="panel">
        <div class="admin-box">
            <h3 style="margin:0; color:#856404;">📥 Import Daily Question Code</h3>
            <p style="font-size:13px; color:#856404; margin: 5px 0 15px 0;">Jo code main (AI) dunga use yahan paste karke update karein. Ye automatic naya Set bana dega:</p>
            <textarea id="import-code-area" rows="6" placeholder="Paste the generated code here..."></textarea>
            <button class="submit-btn" style="background:#28a745;" onclick="importData()">Update Platform Data</button>
        </div>
    </div>
</div>

<script>
    // Initial Starter Data grouped by date/sets
    const defaultSets = [
        {
            setName: "Set 1 (Starter)",
            OWS: [{q: "Words inscribed on a tomb", a: "Epitaph", o: ["Epitaph", "Obituary", "Sermon", "Autobiography"], e: "Epitaph matlab samadhi-lekh."}],
            Synonym: [{q: "Synonym of 'Idle'?", a: "Lazy", o: ["Lazy", "Active", "Busy", "Industrious"], e: "Idle ka matlab hota hai aalsi."}],
            Antonym: [{q: "Antonym of 'Arrogant'?", a: "Humble", o: ["Humble", "Proud", "Cruel", "Egoistic"], e: "Arrogant ka ulta Humble hota hai."}],
            Idiom: [{q: "Meaning of idiom: 'Once in a blue moon'", a: "Very rarely", o: ["Very rarely", "Frequently", "Everyday", "At midnight"], e: "Once in a blue moon matlab jo bohot kam ho."}]
        }
    ];

    let savedSets = JSON.parse(localStorage.getItem('mts_setsData')) || defaultSets;
    let historyLogs = JSON.parse(localStorage.getItem('mts_historyLogs')) || [];
    let selectedSetName = savedSets[0].setName;
    let chartObj = null;

    let activeQuiz = [];
    let curQ = 0;
    let quizScore = 0;
    let chosenAnswer = null;
    let timerInterval = null;
    let timeLeft = 0;

    function saveToStorage() {
        localStorage.setItem('mts_setsData', JSON.stringify(savedSets));
        localStorage.setItem('mts_historyLogs', JSON.stringify(historyLogs));
        renderSetButtons();
    }

    function renderSetButtons() {
        const container = document.getElementById('set-buttons-container');
        container.innerHTML = savedSets.map(s => `
            <button class="set-btn ${selectedSetName === s.setName ? 'selected' : ''}" onclick="selectSet('${s.setName}')">
                ${s.setName}
            </button>
        `).join('');
    }

    function selectSet(name) {
        selectedSetName = name;
        renderSetButtons();
    }

    function toggleTimerInput() {
        const checked = document.getElementById('timer-toggle').checked;
        document.getElementById('timer-seconds-box').style.visibility = checked ? 'visible' : 'hidden';
    }

    function switchPanel(panelName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelector(`[onclick="switchPanel('${panelName}')"]`).classList.add('active');
        document.getElementById(`panel-${panelName}`).classList.add('active');
        if(panelName === 'analytics') loadChart();
    }

    function importData() {
        const rawCode = document.getElementById('import-code-area').value.trim();
        if(!rawCode) return alert("Pehle code paste karein!");

        try {
            const parsed = JSON.parse(rawCode);
            if(parsed.questions && parsed.questions.length > 0) {
                const newSetName = `Set ${savedSets.length + 1} (${new Date().toLocaleDateString('en-IN', {day:'numeric', month:'short'})})`;
                
                const newSet = {
                    setName: newSetName,
                    OWS: parsed.questions.filter(q => parsed.type === 'OWS'),
                    Synonym: parsed.questions.filter(q => parsed.type === 'Synonym'),
                    Antonym: parsed.questions.filter(q => parsed.type === 'Antonym'),
                    Idiom: parsed.questions.filter(q => parsed.type === 'Idiom')
                };

                savedSets.push(newSet);
                selectedSetName = newSetName;
                saveToStorage();
                alert(`Zabardast! Ek naya section "${newSetName}" ban gaya hai aur usme ${parsed.questions.length} sawaal add ho gaye hain!`);
                document.getElementById('import-code-area').value = "";
                switchPanel('test');
            } else {
                alert("Code valid format me nahi hai.");
            }
        } catch(e) {
            alert("Kuch galti hui! Kripya sahi code use karein.");
        }
    }

    function startQuiz(category) {
        const currentSet = savedSets.find(s => s.setName === selectedSetName);
        
        if(category === 'MIX') {
            activeQuiz = [...currentSet.OWS, ...currentSet.Synonym, ...currentSet.Antonym, ...currentSet.Idiom];
        } else {
            activeQuiz = currentSet[category] || [];
        }

        if(activeQuiz.length === 0) return alert(`Is selected Set me ${category} ke koi sawaal nahi hain! Pehle Admin me code daalein.`);

        activeQuiz.sort(() => 0.5 - Math.random());
        curQ = 0;
        quizScore = 0;

        document.getElementById('menu-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        clearInterval(timerInterval);
        chosenAnswer = null;
        const qData = activeQuiz[curQ];
        const isTimerEnabled = document.getElementById('timer-toggle').checked;
        
        const qView = document.getElementById('quiz-view');
        qView.innerHTML = `
            <div class="quiz-box">
                <div class="q-header">
                    <span>Set: <strong>${selectedSetName}</strong></span>
                    ${isTimerEnabled ? `<span class="timer-badge">⏱️ Time Left: <span id="timer-clock">--</span>s</span>` : '<span>Timer: OFF</span>'}
                    <span>Question ${curQ + 1} of ${activeQuiz.length}</span>
                </div>
                <div class="question">${qData.q}</div>
                <div class="options-list">
                    ${qData.o.map(opt => `<button class="opt-button" onclick="selectAnswer(this, '${opt}')">${opt}</button>`).join('')}
                </div>
                <div class="action-container">
                    <button class="quit-btn" onclick="quitQuiz()">Quit Test (Hatna)</button>
                    <button class="submit-btn" id="sub-q-btn" disabled onclick="submitQuestion()">Submit & Next</button>
                </div>
            </div>
        `;

        if(isTimerEnabled) {
            timeLeft = parseInt(document.getElementById('timer-seconds').value) || 15;
            document.getElementById('timer-clock').innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-clock').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitQuestion(); // Auto-submit when time finishes
                }
            }, 1000);
        }
    }

    function selectAnswer(btn, val) {
        document.querySelectorAll('.opt-button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        chosenAnswer = val;
        document.getElementById('sub-q-btn').disabled = false;
    }

    function submitQuestion() {
        clearInterval(timerInterval);
        if(chosenAnswer && chosenAnswer === activeQuiz[curQ].a) quizScore++;
        curQ++;
        if(curQ < activeQuiz.length) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function quitQuiz() {
        if(confirm("Kya aap sach me test se hatna chahte hain?")) {
            clearInterval(timerInterval);
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'block';
        }
    }

    function finishQuiz() {
        const finalPct = Math.round((quizScore / activeQuiz.length) * 100);
        historyLogs.push({ date: new Date().toLocaleDateString('en-IN', {day:'numeric', month:'short'}), mode: selectedSetName, score: finalPct });
        localStorage.setItem('mts_historyLogs', JSON.stringify(historyLogs));

        document.getElementById('quiz-view').innerHTML = `
            <div class="quiz-box" style="text-align:center;">
                <h2>Mock Test Completed!</h2>
                <div class="score-big">${quizScore} / ${activeQuiz.length}</div>
                <p>Aapka accuracy score **${finalPct}%** raha.</p>
                <button class="submit-btn" style="background:#6c757d;" onclick="exitQuizView()">Back to Dashboard</button>
            </div>
        `;
    }

    function exitQuizView() {
        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('menu-view').style.display = 'block';
    }

    function loadChart() {
        const ctx = document.getElementById('analyticsChart').getContext('2d');
        if(chartObj) chartObj.destroy();

        let labels = historyLogs.map(l => `${l.date} (${l.mode})`);
        let data = historyLogs.map(l => l.score);

        if(historyLogs.length === 0) {
            labels = ["Demo Set 1", "Demo Set 2"];
            data = [50, 80];
        }

        chartObj = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Score Percentage (%)',
                    data: data,
                    borderColor: '#007bff',
                    backgroundColor: 'rgba(0, 123, 255, 0.05)',
                    tension: 0.2,
                    fill: true
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
        });
    }

    // Initialize Page
    renderSetButtons();
</script>
</body>
</html>
